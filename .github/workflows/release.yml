name: Handmatige APK Build

on:
  workflow_dispatch: # Voegt de handmatige startknop toe

jobs:
  build:
    runs-on: ubuntu-24.04 # We zetten hem vast op een stabiele versie
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5 # Geüpdatet naar de nieuwste versie
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # We bouwen een Debug APK (hiervoor zijn GEEN geheime keys nodig)
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Dit zorgt ervoor dat de APK als downloadbare knop verschijnt
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rusty-app-debug
          path: app/build/outputs/apk/debug/*.apk
